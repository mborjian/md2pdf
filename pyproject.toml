[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "md2pdf"
version = "0.1.0"
description = "Convert Markdown files to PDF with templates, projects and a Streamlit UI."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "markdown>=3.4",
    "weasyprint>=60",
    "pygments>=2.15",
    "streamlit[pdf]>=1.36",
]

[project.scripts]
md2pdf = "md2pdf.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
